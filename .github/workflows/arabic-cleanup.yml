name: Arabic Cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arabic-cleanup.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Clean translation artifacts and Egyptian currency
        run: |
          python - <<'PY'
          import pathlib
          roots=[pathlib.Path('frontend/src'),pathlib.Path('frontend/public'),pathlib.Path('backend/src')]
          exts={'.ts','.tsx','.js','.jsx','.json','.css','.md','.html'}
          replacements=[
            ('₪','ج.م'),
            ("نص'نص",'شيك'),
            ("ج'نص",'شيك'),
            ('خطأ نصدمج','خطأ في الدمج'),
            ('خطأ نصإلغاء','خطأ في الإلغاء'),
            ('خطأ نصحذف','خطأ في الحذف'),
            ('ماك&quot;نص','كود'),
            ('ماك"نص','كود'),
            ('نصعميل الرئيسي','العميل الرئيسي'),
            ('نصعميل سيتم حذف الثاني','وسيتم حذف العميل الثاني'),
            ('منعملاء نصعميل واحد','العميلين في عميل واحد'),
            ("ضريبة' شيك",'رقم شيك'),
            ("ضريبة' فاتورة",'رقم الحساب'),
            ("ضريبة' بنك",'رقم البنك'),
            ("ضريبة' فرع",'رقم الفرع'),
            ('المبلغ بالشيكل','المبلغ بالجنيه المصري'),
            ('بالشيكل','بالجنيه المصري'),
            ('شيكل','جنيه مصري'),
            ('50ج.م','50 ج.م'),
            ('200ج.م','200 ج.م'),
            (' نص${p.method}',' - ${p.method}'),
            ('`${day} نص${month}`','`${day} ${month}`'),
          ]
          changed=[]
          for root in roots:
            if not root.exists(): continue
            for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts: continue
              try: text=p.read_text(encoding='utf-8')
              except: continue
              new=text
              for a,b in replacements:
                new=new.replace(a,b)
              if new!=text:
                p.write_text(new,encoding='utf-8')
                changed.append(str(p))
          print('changed',len(changed))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/public backend/src
          git commit -m "fix: clean Arabic translation and use EGP" || exit 0
          git push