name: Hebrew Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hebrew-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Hebrew text
        run: |
          python - <<'PY'
          import json, pathlib, re
          roots = [pathlib.Path("frontend/src"), pathlib.Path("frontend/public"), pathlib.Path("backend/src")]
          allowed = {".ts",".tsx",".js",".jsx",".json",".css",".md",".html"}
          heb = re.compile(r"[\u0590-\u05FF]")
          hits = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in allowed:
                      continue
                  try:
                      lines = p.read_text(encoding="utf-8").splitlines()
                  except Exception:
                      continue
                  for n,line in enumerate(lines,1):
                      if heb.search(line):
                          hits.append({"file": str(p).replace("\\","/"), "line": n, "text": line.strip()})
          pathlib.Path("docs").mkdir(exist_ok=True)
          pathlib.Path("docs/hebrew-audit.json").write_text(json.dumps(hits, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Hebrew lines: {len(hits)}")
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hebrew-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: audit remaining Hebrew text"
          git push
