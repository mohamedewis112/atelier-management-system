name: Import Atelier Base

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-base.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import MIT-licensed dress rental base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/atelier-upstream
          git clone --depth 1 https://github.com/moyshiginzburg/dress-rental-business-management.git /tmp/atelier-upstream
          mkdir -p docs
          cp /tmp/atelier-upstream/README.md docs/UPSTREAM_README.md
          git -C /tmp/atelier-upstream rev-parse HEAD > UPSTREAM_COMMIT.txt
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='README.md' /tmp/atelier-upstream/ ./
          echo "" >> .gitignore
          echo "# Atelier public-repo safeguards" >> .gitignore
          echo "local_data/" >> .gitignore
          echo "*.db" >> .gitignore
          echo "*.sqlite" >> .gitignore
          echo "*.sqlite3" >> .gitignore
          echo ".env" >> .gitignore
          echo ".env.*" >> .gitignore
          echo "!.env.example" >> .gitignore
          echo "customer-data/" >> .gitignore
          echo "private-uploads/" >> .gitignore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."
            exit 0
          fi
          git commit -m "chore: import MIT dress-rental base"
          git push origin HEAD:main
